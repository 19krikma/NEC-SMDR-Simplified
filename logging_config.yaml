# Logging 
version: 1
disable_existing_loggers: False

formatters:
    simple:
        format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
        datefmt: '%Y-%m-%d %H:%M:%S'

loggers:
    development:
        level: DEBUG
        propagate: no

    staging:
        level: INFO
        propagate: no

    production:
        level: WARNING
        propagate: no

root:
    level: DEBUG